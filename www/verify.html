<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>照片验真 · 此刻相机</title>
<link rel="icon" href="icons/icon.svg">
<style>
  :root{
    --bg:#0a0c10; --panel:#151a23; --line:#252c38; --txt:#eef2f8; --sub:#96a1b2;
    --ok:#3ddc84; --warn:#ffd24a; --bad:#ff6b6b; --accent:#ffd24a;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    padding:0 16px calc(28px + var(--safe-b));
    min-height:100dvh;
  }
  header{padding:18px 2px 10px}
  h1{font-size:17px;margin:0 0 4px;font-weight:600}
  header p{margin:0;font-size:12px;color:var(--sub);line-height:1.6}
  .drop{
    margin-top:14px; border:1.5px dashed var(--line); border-radius:16px;
    padding:26px 18px; text-align:center; background:#0f131a;
    transition:.18s;
  }
  .drop.over{border-color:var(--accent); background:rgba(255,210,74,.06)}
  .drop p{margin:0 0 12px;font-size:13px;color:var(--sub);line-height:1.6}
  .btn{
    display:inline-block; padding:12px 22px; border-radius:12px; border:0;
    background:var(--accent); color:#1a1400; font-size:14px; font-weight:600;
    font-family:inherit;
  }
  .btn.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--line);font-weight:400;font-size:13px;padding:9px 16px}
  .card{
    margin-top:16px; border:1px solid var(--line); border-radius:16px;
    background:var(--panel); overflow:hidden;
  }
  .verdict{padding:16px;display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line)}
  .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;margin-top:5px}
  .verdict h2{margin:0;font-size:15px;font-weight:600;line-height:1.4}
  .verdict small{display:block;margin-top:4px;font-size:12px;color:var(--sub);line-height:1.6;font-weight:400}
  .rows{padding:4px 16px 12px}
  .row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:13px;line-height:1.5}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--sub);flex:0 0 74px;font-size:12.5px}
  .row .v{flex:1;word-break:break-all;user-select:text}
  .row .v.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:.5px}
  .actions{padding:0 16px 16px;display:flex;gap:10px;flex-wrap:wrap}
  .prev{display:block;width:100%;max-height:38vh;object-fit:contain;background:#000}
  .trusted-list{margin-top:22px}
  .trusted-list h3{font-size:12.5px;color:var(--sub);font-weight:500;margin:0 0 8px}
  .trusted-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;letter-spacing:.5px;
  }
  .trusted-item button{background:none;border:0;color:#7b8595;font-size:12px;font-family:inherit}
  .foot{margin-top:26px;font-size:11.5px;color:#5f6a7a;line-height:1.8}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);
    background:#1b2130;border:1px solid var(--line);border-radius:999px;
    padding:10px 18px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <h1>照片验真</h1>
  <p>把「此刻相机」拍出的照片（原始文件）拖进来，或点下面选择文件。截图、微信压缩、二次编辑都会导致验真失败。</p>
</header>

<div class="drop" id="drop">
  <p>拖入照片，或直接 Ctrl+V 粘贴</p>
  <button class="btn" id="btnPick">选择照片</button>
  <input type="file" id="fileInput" accept="image/jpeg,image/*" hidden>
</div>

<div id="result"></div>

<div class="trusted-list" id="trustedWrap" hidden>
  <h3>本机已信任的签名者</h3>
  <div id="trustedList"></div>
</div>

<p class="foot">
  原理：照片文件里带有一段数字签名，签名覆盖「时间、经纬度、地址、来源、图片哈希」。验真页会用签名者公钥重新验算：文件一改，哈希对不上；签名一改，验签不通过。<br>
  注意：验真只能证明「这张图由该指纹对应的设备签名，且签名后未被改动」，不能证明拍摄者没有作弊（改系统时间、虚拟定位、翻拍屏幕）。
</p>

<div class="toast" id="toast"></div>

<script src="js/crypto-wmc.js"></script>
<script src="js/verify.js"></script>
</body>
</html>
